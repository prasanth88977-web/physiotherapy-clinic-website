<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clinic Admin Portal</title><style>
:root{--navy:#103d59;--teal:#23a8a7;--pale:#eef9f8;--ink:#173240;--muted:#6b7e86;--line:#dbe8eb;--danger:#b52f3d}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#f6fafb;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eaf9f8,#fff)}.login-card{width:min(430px,100%);background:white;border:1px solid var(--line);border-radius:24px;padding:34px;box-shadow:0 18px 60px #103d5915}.login-card img{width:110px;height:110px;object-fit:contain;display:block;margin:auto}.login-card h1{text-align:center;color:var(--navy);margin:12px 0 4px;font-size:25px}.login-card p{text-align:center;color:var(--muted);margin:0 0 25px}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #cddde1;border-radius:11px;padding:11px 12px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px #23a8a71a}.primary{border:0;background:var(--navy);color:white;border-radius:11px;padding:12px 16px;font-weight:750}.secondary{border:1px solid #bcd1d7;background:white;color:var(--navy);border-radius:11px;padding:10px 14px;font-weight:700}.danger{border:0;background:#fff0f1;color:var(--danger);border-radius:9px;padding:8px 11px;font-weight:700}.shell{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:var(--navy);color:white;padding:22px 15px;position:sticky;top:0;height:100vh}.brand{display:flex;gap:10px;align-items:center;padding:4px 7px 24px}.brand img{width:48px;height:48px;object-fit:contain;background:#fff;border-radius:12px}.brand strong{font-size:13px;line-height:1.25}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#d9edf0;text-align:left;padding:12px;border-radius:10px}.nav button.active,.nav button:hover{background:#ffffff16;color:white}.side .logout{position:absolute;bottom:20px;left:15px;right:15px;background:#ffffff12;border:1px solid #ffffff2b;color:white;border-radius:10px;padding:11px}.main{padding:26px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;color:var(--navy);font-size:28px}.top small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px}.stat small{color:var(--muted)}.stat b{display:block;font-size:27px;color:var(--navy);margin-top:7px}.panel{background:#fff;border:1px solid var(--line);border-radius:17px;padding:20px;margin-top:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panel h2{font-size:18px;margin:0;color:var(--navy)}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.toolbar input{border:1px solid var(--line);padding:10px 12px;border-radius:10px;min-width:240px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf2f3;font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}td strong{color:var(--navy)}.modal{position:fixed;inset:0;background:#0d273855;display:grid;place-items:center;padding:20px;z-index:5}.modal-card{width:min(720px,100%);max-height:90vh;overflow:auto;background:white;border-radius:20px;padding:24px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head h2{margin:0;color:var(--navy)}.x{border:0;background:#eef4f5;border-radius:50%;width:34px;height:34px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px}.span2{grid-column:1/-1}.alert{padding:11px 13px;border-radius:10px;background:#fff3e9;color:#8a4d12;margin:12px 0;font-size:13px}.toast{position:fixed;right:20px;bottom:20px;background:var(--navy);color:white;padding:12px 16px;border-radius:10px;display:none;z-index:10}.empty{padding:25px;text-align:center;color:var(--muted)}@media(max-width:850px){.shell{grid-template-columns:1fr}.side{height:auto;position:relative}.nav{grid-template-columns:repeat(4,1fr)}.nav button{font-size:12px;text-align:center}.side .logout{position:static;width:100%;margin-top:10px}.grid{grid-template-columns:1fr 1fr}.main{padding:17px}}@media(max-width:560px){.grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.top{align-items:flex-start;gap:10px}.top h1{font-size:23px}}
</style></head><body>
<section id="login" class="login"><div class="login-card"><img src="/logo.png"><h1>Clinic Admin Portal</h1><p>Secure patient & receipt management</p><form id="loginForm"><div class="field"><label>Username</label><input id="username" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" style="width:100%">Sign in</button><div id="loginMsg" class="alert hidden"></div></form></div></section>
<section id="app" class="shell hidden"><aside class="side"><div class="brand"><img src="/logo.png"><strong>Physiotherapy Homecare & Rehabilitation Clinic</strong></div><div class="nav"><button class="active" data-view="dashboard">Dashboard</button><button data-view="patients">Patients</button><button data-view="receipts">Receipts</button><button data-view="settings">Settings</button></div><button class="logout" id="logout">Sign out</button></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><small id="welcome"></small></div></div><div id="content"></div></main></section>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h2 id="modalTitle"></h2><button class="x" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const $=s=>document.querySelector(s);let view='dashboard',patients=[],receipts=[];
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2600)}
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function boot(){const m=await api('/api/me');if(!m.authenticated)return;$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#welcome').textContent='Signed in as '+m.username;if(m.mustChangePassword)showPasswordModal(true);render()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('#username').value,password:$('#password').value})});$('#login').classList.add('hidden');$('#app').classList.remove('hidden');$('#welcome').textContent='Signed in as '+d.username;if(d.mustChangePassword)showPasswordModal(true);render()}catch(err){$('#loginMsg').textContent=err.message;$('#loginMsg').classList.remove('hidden')}};
$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.reload()};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});
async function render(){let c=$('#content');$('#title').textContent=view[0].toUpperCase()+view.slice(1);if(view==='dashboard'){const d=await api('/api/dashboard');c.innerHTML=`<div class="grid"><div class="stat"><small>Total Patients</small><b>${d.patients.count}</b></div><div class="stat"><small>Total Receipts</small><b>${d.receipts.count}</b></div><div class="stat"><small>Total Collections</small><b>₹ ${Number(d.receipts.total).toLocaleString('en-IN')}</b></div><div class="stat"><small>Today's Collections</small><b>₹ ${Number(d.today.total).toLocaleString('en-IN')}</b></div></div><div class="panel"><div class="panel-head"><h2>Clinic</h2><span style="color:var(--muted);font-size:13px">Vayalpad • +91 76600 32158</span></div><p style="color:var(--muted);line-height:1.7">Use this portal to maintain patient records and issue professional payment receipts. Patient data is stored in the configured PostgreSQL database, not browser local storage.</p></div>`}else if(view==='patients'){await loadPatients();c.innerHTML=`<div class="panel"><div class="panel-head"><h2>Patients</h2><div class="toolbar"><input id="patientSearch" placeholder="Search name, phone or ID"><button class="primary" onclick="patientModal()">+ Add Patient</button></div></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Patient</th><th>Phone</th><th>Age/Gender</th><th>Condition</th><th>Actions</th></tr></thead><tbody>${patients.map(p=>`<tr><td><strong>${esc(p.patient_code)}</strong></td><td>${esc(p.full_name)}</td><td>${esc(p.phone)}</td><td>${esc(p.age||'-')} / ${esc(p.gender||'-')}</td><td>${esc(p.condition||'-')}</td><td><button class="secondary" onclick="patientModal(${p.id})">Edit</button> <button class="danger" onclick="deletePatient(${p.id})">Delete</button></td></tr>`).join('')||`<tr><td colspan="6" class="empty">No patients found.</td></tr>`}</tbody></table></div></div>`;$('#patientSearch').oninput=()=>filterPatients($('#patientSearch').value)}else if(view==='receipts'){await loadReceipts();await loadPatients();c.innerHTML=`<div class="panel"><div class="panel-head"><h2>Receipts</h2><div class="toolbar"><button class="primary" onclick="receiptModal()">+ New Receipt</button></div></div><div class="table-wrap"><table><thead><tr><th>Receipt</th><th>Patient</th><th>Service</th><th>Amount</th><th>Payment</th><th>Date</th><th>Actions</th></tr></thead><tbody>${receipts.map(r=>`<tr><td><strong>${esc(r.receipt_number)}</strong></td><td>${esc(r.full_name)}</td><td>${esc(r.service)} (${r.sessions})</td><td>₹ ${Number(r.amount).toLocaleString('en-IN')}</td><td>${esc(r.payment_method)}</td><td>${new Date(r.issued_at).toLocaleDateString('en-IN')}</td><td><a class="secondary" style="text-decoration:none;display:inline-block" target="_blank" href="/api/receipts/${r.id}/pdf">PDF</a> <button class="danger" onclick="deleteReceipt(${r.id})">Delete</button></td></tr>`).join('')||`<tr><td colspan="7" class="empty">No receipts yet.</td></tr>`}</tbody></table></div></div>`}else{c.innerHTML=`<div class="panel"><div class="panel-head"><h2>Security</h2></div><p style="color:var(--muted)">Change the admin password regularly. Sessions expire after 8 hours and the server applies login rate limiting.</p><button class="primary" onclick="showPasswordModal(false)">Change Password</button></div><div class="panel"><h2>Clinic details</h2><p style="color:var(--muted);line-height:1.8">Physiotherapy Homecare & Rehabilitation Clinic<br>Opposite TTD Kalyana Mandapam, near APSRTC Bus Stand, Vayalpad<br>+91 76600 32158 • rehabilitationclinicvld@gmail.com</p></div>`}}
async function loadPatients(q=''){patients=await api('/api/patients?q='+encodeURIComponent(q))}async function loadReceipts(){receipts=await api('/api/receipts')}async function filterPatients(q){await loadPatients(q);render()}
function openModal(title,body){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=body;$('#modal').classList.remove('hidden')}function closeModal(){$('#modal').classList.add('hidden')}
function patientModal(id){const p=patients.find(x=>x.id===id)||{};openModal(id?'Edit Patient':'Add Patient',`<form id="patientForm"><div class="form-grid"><div class="field"><label>Full name</label><input name="fullName" value="${esc(p.full_name)}" required></div><div class="field"><label>Phone</label><input name="phone" value="${esc(p.phone)}" required></div><div class="field"><label>Age</label><input name="age" type="number" min="0" max="120" value="${esc(p.age||'')}"></div><div class="field"><label>Gender</label><select name="gender"><option value="">Select</option><option ${p.gender==='Male'?'selected':''}>Male</option><option ${p.gender==='Female'?'selected':''}>Female</option><option ${p.gender==='Other'?'selected':''}>Other</option></select></div><div class="field span2"><label>Condition / diagnosis</label><input name="condition" value="${esc(p.condition)}"></div><div class="field span2"><label>Address</label><textarea name="address" rows="2">${esc(p.address)}</textarea></div><div class="field span2"><label>Notes</label><textarea name="notes" rows="3">${esc(p.notes)}</textarea></div></div><button class="primary">Save Patient</button></form>`);$('#patientForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{await api(id?'/api/patients/'+id:'/api/patients',{method:id?'PUT':'POST',body:JSON.stringify(data)});closeModal();toast(id?'Patient updated':'Patient added');render()}catch(err){alert(err.message)}}}
async function deletePatient(id){if(!confirm('Delete this patient? If they have receipts, deletion will be blocked to preserve financial history.'))return;try{await api('/api/patients/'+id,{method:'DELETE'});toast('Patient deleted');render()}catch(e){alert(e.message)}}
function receiptModal(){openModal('New Payment Receipt',`<form id="receiptForm"><div class="form-grid"><div class="field span2"><label>Patient</label><select name="patientId" required><option value="">Select patient</option>${patients.map(p=>`<option value="${p.id}">${esc(p.patient_code)} — ${esc(p.full_name)} — ${esc(p.phone)}</option>`).join('')}</select></div><div class="field span2"><label>Service / therapy</label><input name="service" placeholder="e.g. Physiotherapy session" required></div><div class="field"><label>Sessions</label><input name="sessions" type="number" min="1" value="1" required></div><div class="field"><label>Amount (₹)</label><input name="amount" type="number" min="0" step="0.01" required></div><div class="field"><label>Payment method</label><select name="paymentMethod"><option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option></select></div><div class="field"><label>Notes</label><input name="notes"></div></div><button class="primary">Create Receipt</button></form>`);$('#receiptForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{const r=await api('/api/receipts',{method:'POST',body:JSON.stringify(data)});closeModal();toast('Receipt '+r.receipt_number+' created');window.open('/api/receipts/'+r.id+'/pdf','_blank');render()}catch(err){alert(err.message)}}}
async function deleteReceipt(id){if(!confirm('Delete this receipt?'))return;try{await api('/api/receipts/'+id,{method:'DELETE'});toast('Receipt deleted');render()}catch(e){alert(e.message)}}
function showPasswordModal(force){openModal('Change Admin Password',`${force?'<div class="alert">For security, you must change the initial password before continuing.</div>':''}<form id="pwForm"><div class="field"><label>Current password</label><input name="currentPassword" type="password" required></div><div class="field"><label>New password</label><input name="newPassword" type="password" minlength="10" required><small style="color:var(--muted)">Use 10+ characters with a mix of letters, numbers and symbols.</small></div><button class="primary">Update Password</button></form>`);$('#pwForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/change-password',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('Password changed successfully')}catch(err){alert(err.message)}}}
boot().catch(()=>{});
</script></body></html>
